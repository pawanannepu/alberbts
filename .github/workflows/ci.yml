name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  # `next build` queries the catalog (generateStaticParams), so this job needs a database.
  # Add a DATABASE_URL repository secret (a Neon branch of the seeded database is ideal);
  # without it the job skips itself instead of failing.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - name: Check for DATABASE_URL
        id: db
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATABASE_URL secret not set, skipping the production build"; fi
      - uses: actions/checkout@v4
        if: steps.db.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.db.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.db.outputs.present == 'true'
      - run: npm run build
        if: steps.db.outputs.present == 'true'
